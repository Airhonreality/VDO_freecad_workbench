[project]
name = "vdo"
version = "2.0.0"
description = "Workbench de muebles paramétricos para FreeCAD"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Alcance de medición (decisión D-04 en docs/PLAN_MINIMALISMO_VDO.md §2):
# `ruff check .` desde la raíz, sin excluir carpetas. Medido con ruff 0.17.3 (.venv).
# Cifras por carpeta: freecad/ 147, tests/ 86, tools/ 58, Init.py + InitGui.py 8 (total 299).
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C901", "SIM", "I", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"freecad/vdo/cad/**" = ["F401"]
"freecad/vdo/commands.py" = ["F401"]
"freecad/vdo/ui/**" = ["F401", "E501"]
"tests/**" = ["E501", "F401"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
packages = ["freecad.vdo.core", "freecad.vdo.cad"]
ignore_missing_imports = true

[tool.ruff.lint.mccabe]
# Umbral de complejidad del plan (R8, F19-D11 / M-15): máximo 12.
max-complexity = 12
